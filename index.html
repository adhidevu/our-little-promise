<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Little Promise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Our Little Promise ❤️</h1>
  <p>A small place for our beautiful memories.</p>
  <button>Open Our Story❤️</button>
  <section>
  <h2>Our Little Promise ❤️</h2>
  <p>A small place for our memories and moments.</p>
   <button onclick="showMessage()">Start Our Journey</button>
    <p id="message">Ready to start our journey? ❤️</p>
</section>
  <script>
function showMessage() {
  document.getElementById("message").textContent =
    "Our journey starts here. ❤️";
}
    function showMemory() {
  document.getElementById("memory-text").textContent =
    "Some moments are small, but they stay with us forever. ❤️";
    }
      function showMemory2() {
  document.getElementById("memory-text-2").textContent =
    "The best memories are the ones we create together. ❤️";
}
</script>
  <div class="memory-box">
  <h3>Our Memories 📸</h3>
  <p>Every little moment becomes a memory.</p>
    <button onclick="showMemory()">View a Memory ❤️</button>
<p id="memory-text"></p>
</div>
  <div class="memory-box">
  <h3>One More Memory 💕</h3>
  <p id="memory-text-2"></p>
  <button onclick="showMemory2()">Open ❤️</button>
</div>
</body>
</html>
